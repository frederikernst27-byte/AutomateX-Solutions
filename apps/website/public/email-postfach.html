<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gmail Postfach</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202a;
      --muted: #6f7782;
      --line: #dde2e8;
      --soft: #eef2f6;
      --accent: #1f7a5a;
      --accent-strong: #146645;
      --danger: #b3261e;
      --shadow: 0 10px 30px rgba(20, 32, 45, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 170px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .status {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      min-height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .btn.primary:hover { background: var(--accent-strong); }
    .btn:disabled { cursor: not-allowed; opacity: .55; }

    .main {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .connect {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--text);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .list {
      overflow: auto;
      min-height: 0;
    }

    .mail {
      width: 100%;
      display: grid;
      gap: 5px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: white;
      padding: 12px 14px;
      cursor: pointer;
    }

    .mail:hover, .mail.active { background: var(--soft); }

    .mail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .sender, .subject {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sender {
      font-weight: 800;
      font-size: 13px;
    }

    .date {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
    }

    .subject {
      font-size: 13px;
      font-weight: 700;
    }

    .snippet {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reader {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 22px;
    }

    .empty, .message {
      max-width: 880px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .empty {
      padding: 34px;
      color: var(--muted);
      text-align: center;
    }

    .message-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }

    .message-head h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.25;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .body {
      padding: 22px;
      white-space: pre-wrap;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .error { color: var(--danger); }

    @media (max-width: 800px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .main { grid-template-columns: 1fr; }
      .sidebar { min-height: 48vh; border-right: 0; border-bottom: 1px solid var(--line); }
      .reader { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">M</div>
        <div>
          <h1>Minimal Mailbox</h1>
          <div class="status" id="status">Nicht verbunden</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="refreshBtn" disabled>Aktualisieren</button>
        <button class="btn" id="signOutBtn" disabled>Trennen</button>
        <button class="btn primary" id="connectBtn">Mit Gmail verbinden</button>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <section class="connect">
          <label>
            Google OAuth Client ID
            <input id="clientId" autocomplete="off" placeholder="1234567890-abc.apps.googleusercontent.com">
          </label>
        </section>
        <div class="notice">
          Benötigt in Google Cloud eine Web-OAuth-Client-ID und den Scope <b>gmail.readonly</b>. Die Seite liest nur, sie sendet und löscht nichts.
        </div>
        <div class="toolbar">
          <input id="query" value="in:inbox newer_than:14d" aria-label="Gmail Suche">
          <button class="btn" id="searchBtn" disabled>Suchen</button>
        </div>
        <div class="list" id="list"></div>
      </aside>

      <section class="reader" id="reader">
        <div class="empty">
          Gmail verbinden, dann erscheint hier dein leichtes Postfach.
        </div>
      </section>
    </main>
  </div>

  <script>
    const SCOPE = "https://www.googleapis.com/auth/gmail.readonly";
    const GMAIL_API = "https://gmail.googleapis.com/gmail/v1/users/me";
    const els = {
      status: document.getElementById("status"),
      clientId: document.getElementById("clientId"),
      connect: document.getElementById("connectBtn"),
      signOut: document.getElementById("signOutBtn"),
      refresh: document.getElementById("refreshBtn"),
      search: document.getElementById("searchBtn"),
      query: document.getElementById("query"),
      list: document.getElementById("list"),
      reader: document.getElementById("reader")
    };

    let tokenClient = null;
    let accessToken = "";
    let messages = [];
    let activeId = "";

    els.clientId.value = localStorage.getItem("gmail_client_id") || "";

    function setStatus(text, isError) {
      els.status.textContent = text;
      els.status.className = isError ? "status error" : "status";
    }

    function setConnected(connected) {
      els.connect.disabled = connected;
      els.signOut.disabled = !connected;
      els.refresh.disabled = !connected;
      els.search.disabled = !connected;
    }

    function ensureClient() {
      const clientId = els.clientId.value.trim();
      if (!clientId) {
        setStatus("Bitte OAuth Client ID eintragen", true);
        return false;
      }
      localStorage.setItem("gmail_client_id", clientId);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPE,
        callback: async response => {
          if (response.error) {
            setStatus(response.error, true);
            return;
          }
          accessToken = response.access_token;
          setConnected(true);
          await loadProfile();
          await loadMessages();
        }
      });
      return true;
    }

    async function gmail(path) {
      const res = await fetch(`${GMAIL_API}${path}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadProfile() {
      try {
        const profile = await gmail("/profile");
        setStatus(`Verbunden: ${profile.emailAddress}`);
      } catch (error) {
        setStatus("Profil konnte nicht geladen werden", true);
      }
    }

    async function loadMessages() {
      setStatus("Lade E-Mails...");
      els.list.innerHTML = "";
      const query = encodeURIComponent(els.query.value.trim() || "in:inbox newer_than:14d");
      try {
        const list = await gmail(`/messages?maxResults=20&q=${query}`);
        const refs = list.messages || [];
        messages = await Promise.all(refs.map(ref => gmail(`/messages/${ref.id}?format=full`)));
        renderList();
        if (messages[0]) openMessage(messages[0].id);
        else showEmpty("Keine E-Mails für diese Suche gefunden.");
        await loadProfile();
      } catch (error) {
        setStatus("Gmail konnte nicht geladen werden", true);
        showEmpty("Fehler beim Laden. Prüfe Client ID, OAuth-Origin und Gmail API.");
      }
    }

    function headerValue(message, name) {
      const headers = message.payload?.headers || [];
      return headers.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || "";
    }

    function decodeBase64Url(data) {
      if (!data) return "";
      const normalized = data.replace(/-/g, "+").replace(/_/g, "/");
      return decodeURIComponent(escape(atob(normalized)));
    }

    function bodyFromPart(part) {
      if (!part) return "";
      if (part.mimeType === "text/plain" && part.body?.data) return decodeBase64Url(part.body.data);
      if (part.parts) {
        for (const child of part.parts) {
          const text = bodyFromPart(child);
          if (text) return text;
        }
      }
      if (part.body?.data) return decodeBase64Url(part.body.data);
      return "";
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderList() {
      els.list.innerHTML = "";
      messages.forEach(message => {
        const sender = headerValue(message, "From") || "Unbekannter Absender";
        const subject = headerValue(message, "Subject") || "(ohne Betreff)";
        const date = formatDate(headerValue(message, "Date"));
        const button = document.createElement("button");
        button.className = `mail${message.id === activeId ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `
          <div class="mail-top">
            <div class="sender"></div>
            <div class="date"></div>
          </div>
          <div class="subject"></div>
          <div class="snippet"></div>
        `;
        button.querySelector(".sender").textContent = sender;
        button.querySelector(".date").textContent = date;
        button.querySelector(".subject").textContent = subject;
        button.querySelector(".snippet").textContent = message.snippet || "";
        button.addEventListener("click", () => openMessage(message.id));
        els.list.appendChild(button);
      });
    }

    function openMessage(id) {
      activeId = id;
      const message = messages.find(item => item.id === id);
      if (!message) return;
      const sender = headerValue(message, "From") || "Unbekannt";
      const to = headerValue(message, "To") || "";
      const subject = headerValue(message, "Subject") || "(ohne Betreff)";
      const date = formatDate(headerValue(message, "Date"));
      const body = bodyFromPart(message.payload) || message.snippet || "";
      els.reader.innerHTML = `
        <article class="message">
          <div class="message-head">
            <h2></h2>
            <div class="meta">
              <div><b>Von:</b> <span data-field="from"></span></div>
              <div><b>An:</b> <span data-field="to"></span></div>
              <div><b>Datum:</b> <span data-field="date"></span></div>
            </div>
          </div>
          <div class="body"></div>
        </article>
      `;
      els.reader.querySelector("h2").textContent = subject;
      els.reader.querySelector('[data-field="from"]').textContent = sender;
      els.reader.querySelector('[data-field="to"]').textContent = to;
      els.reader.querySelector('[data-field="date"]').textContent = date;
      els.reader.querySelector(".body").textContent = body;
      renderList();
    }

    function showEmpty(text) {
      els.reader.innerHTML = `<div class="empty"></div>`;
      els.reader.querySelector(".empty").textContent = text;
    }

    els.connect.addEventListener("click", () => {
      if (!ensureClient()) return;
      tokenClient.requestAccessToken({ prompt: "consent" });
    });

    els.signOut.addEventListener("click", () => {
      if (accessToken) google.accounts.oauth2.revoke(accessToken);
      accessToken = "";
      messages = [];
      activeId = "";
      els.list.innerHTML = "";
      setConnected(false);
      setStatus("Getrennt");
      showEmpty("Gmail verbinden, dann erscheint hier dein leichtes Postfach.");
    });

    els.refresh.addEventListener("click", loadMessages);
    els.search.addEventListener("click", loadMessages);
    els.query.addEventListener("keydown", event => {
      if (event.key === "Enter" && accessToken) loadMessages();
    });
  </script>
</body>
</html>
