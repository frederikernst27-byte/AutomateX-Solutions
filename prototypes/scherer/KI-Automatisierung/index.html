<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KI-Automatisierungs-Agent</title>
  <style>
    :root {
      --panel: rgba(15,23,42,0.92);
      --panel-2: rgba(15,23,42,0.72);
      --border: rgba(255,255,255,0.08);
      --text: #edf2ff;
      --muted: #9aa7bd;
      --accent: #67e8f9;
      --accent-2: #8b5cf6;
      --ok: #34d399;
      --danger: #fb7185;
      --warn: #f59e0b;
      --shadow: 0 24px 80px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left,  rgba(103,232,249,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139,92,246,0.14), transparent 30%),
        linear-gradient(180deg, #060b16 0%, #0b1220 100%);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      padding: 14px 24px;
      background: rgba(10,16,30,0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      font-size: 0.78rem; color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.ok    { background: var(--ok);     box-shadow: 0 0 0 3px rgba(52,211,153,0.2); }
    .dot.warn  { background: var(--warn);   box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
    .dot.error { background: var(--danger); box-shadow: 0 0 0 3px rgba(251,113,133,0.2); }
    .header-right { display: flex; align-items: center; gap: 8px; }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: min(80%, 860px);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      margin-left: auto;
      background: linear-gradient(135deg, rgba(103,232,249,0.1), rgba(139,92,246,0.13));
      border-color: rgba(103,232,249,0.15);
    }
    .message.assistant {
      background: rgba(255,255,255,0.03);
    }
    .message.system {
      max-width: 100%;
      background: rgba(251,113,133,0.07);
      border-color: rgba(251,113,133,0.2);
      color: #ffd5de;
      font-size: 0.85rem;
    }
    .meta {
      display: block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* Typing indicator */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      width: fit-content;
      animation: fadeUp 0.2s ease;
    }
    .typing-bubble span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s ease infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Composer ── */
    .composer {
      flex-shrink: 0;
      padding: 14px 24px 18px;
      background: rgba(6,11,22,0.85);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quick-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .composer-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 12px 16px;
      font: inherit;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      min-height: 46px;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea:focus {
      border-color: rgba(103,232,249,0.5);
      box-shadow: 0 0 0 3px rgba(103,232,249,0.08);
    }

    /* Buttons */
    button {
      border: none; cursor: pointer;
      border-radius: 12px;
      font: inherit; font-weight: 600;
      padding: 10px 18px;
      transition: transform 0.15s, opacity 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04111a;
      padding: 12px 22px;
      font-size: 0.9rem;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 7px 13px;
    }
    .btn-icon {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      font-size: 0.82rem;
    }
    .counter-badge {
      display: inline-flex; align-items: center;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(103,232,249,0.08);
      border: 1px solid rgba(103,232,249,0.15);
      color: var(--accent); font-size: 0.72rem;
    }

    /* Sending pulse on send btn */
    .sending-pulse {
      background: rgba(103,232,249,0.15) !important;
      color: var(--accent) !important;
    }

    @media (max-width: 700px) {
      .messages-wrap { padding: 14px; }
      .composer { padding: 10px 14px 14px; }
      .message { max-width: 100%; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <span class="logo">⚡ KI-Agent</span>
    <div class="status-pill">
      <span id="statusDot" class="dot warn"></span>
      <span id="statusText">Verbindung wird geprüft…</span>
    </div>
  </div>
  <div class="header-right">
    <span id="historyBadge" class="counter-badge">0 Nachrichten</span>
    <button id="clearHistoryBtn" class="btn-icon" title="Verlauf leeren">↺ Leeren</button>
    <button id="reloadStatusBtn" class="btn-icon" title="Status prüfen">⟳</button>
  </div>
</header>

<!-- Messages -->
<div class="messages-wrap" id="messages"></div>

<!-- Composer -->
<div class="composer">
  <div class="quick-actions">
    <button class="btn-secondary quick" data-prompt="Prüfe die relevanten Dateien und sag mir knapp, was als Nächstes gemacht werden sollte.">Dateien prüfen</button>
    <button class="btn-secondary quick" data-prompt="Erstelle mir einen klaren Umsetzungsplan für die nächste Aufgabe.">Plan erstellen</button>
    <button class="btn-secondary quick" data-prompt="Führe die Aufgabe jetzt direkt aus und gib mir danach eine kurze Zusammenfassung der Änderungen.">Direkt ausführen</button>
    <button class="btn-secondary quick" data-prompt="Was sind die häufigsten Fehler bei UI-Automatisierung mit Playwright und wie vermeide ich sie?">Best Practices</button>
  </div>
  <div class="composer-row">
    <textarea id="messageInput" placeholder="Nachricht eingeben… (Strg+Enter zum Senden)" rows="1"></textarea>
    <button id="sendBtn" class="btn-primary" type="button">Senden ↵</button>
  </div>
</div>

<script>
  const API_BASE = 'http://127.0.0.1:18891';
  const STORAGE_KEY = 'ki-chat-v2';

  const messagesEl   = document.getElementById('messages');
  const input        = document.getElementById('messageInput');
  const sendBtn      = document.getElementById('sendBtn');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const historyBadge = document.getElementById('historyBadge');

  let sending = false;
  let typingEl = null;

  // ── Hilfsfunktionen ──────────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function now() {
    return new Date().toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(kind, text) {
    statusDot.className = `dot ${kind}`;
    statusText.textContent = text;
  }

  function updateBadge(n) {
    historyBadge.textContent = `${n} Nachricht${n !== 1 ? 'en' : ''}`;
  }

  // ── Typing Indicator ─────────────────────────────────────────────────────

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'typing-bubble';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typingEl);
    scrollBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ── Nachrichten ───────────────────────────────────────────────────────────

  function saveHistory() {
    localStorage.setItem(STORAGE_KEY, messagesEl.innerHTML);
  }

  function loadHistory() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      messagesEl.innerHTML = saved;
    } else {
      addMsg('assistant', 'Hallo! Wie kann ich dir bei der Automatisierung helfen?');
    }
    scrollBottom();
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const label = role === 'user' ? 'Du' : 'Agent';
    div.innerHTML = `${esc(text)}<span class="meta">${label} · ${now()}</span>`;
    messagesEl.appendChild(div);
    saveHistory();
    scrollBottom();
    return div;
  }

  // ── Status prüfen ─────────────────────────────────────────────────────────

  async function checkStatus() {
    setStatus('warn', 'Verbindung wird geprüft…');
    try {
      const r = await fetch(`${API_BASE}/api/health`, { cache: 'no-store' });
      const d = await r.json();
      if (d.ok) {
        setStatus('ok', 'Bereit');
      } else {
        setStatus('error', 'Nicht verbunden');
      }
      if (d.historyLength !== undefined) updateBadge(d.historyLength);
    } catch {
      setStatus('error', 'Server offline – .bat neu starten');
    }
  }

  // ── Nachricht senden ──────────────────────────────────────────────────────

  async function sendMessage(message) {
    if (!message || sending) return;
    sending = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('sending-pulse');
    sendBtn.textContent = '…';
    addMsg('user', message);
    input.value = '';
    autoResize();
    setStatus('warn', 'Agent denkt nach…');
    showTyping();

    try {
      const r = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const d = await r.json().catch(() => ({}));
      hideTyping();
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      addMsg('assistant', d.reply || '(keine Antwort)');
      if (d.historyLength !== undefined) updateBadge(d.historyLength);
      setStatus('ok', 'Bereit');
    } catch (e) {
      hideTyping();
      addMsg('system', `Fehler: ${e.message || e}`);
      setStatus('error', 'Fehler bei der Anfrage');
    } finally {
      sending = false;
      sendBtn.disabled = false;
      sendBtn.classList.remove('sending-pulse');
      sendBtn.textContent = 'Senden ↵';
      input.focus();
    }
  }

  // ── Textarea Auto-Resize ──────────────────────────────────────────────────

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }

  input.addEventListener('input', autoResize);

  // ── Event Listeners ───────────────────────────────────────────────────────

  sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendMessage(input.value.trim());
    }
    // Enter ohne Modifier = neue Zeile (Standard)
  });

  document.getElementById('reloadStatusBtn').addEventListener('click', checkStatus);

  document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
    try {
      await fetch(`${API_BASE}/api/history/clear`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
      });
    } catch {}
    messagesEl.innerHTML = '';
    localStorage.removeItem(STORAGE_KEY);
    addMsg('assistant', 'Verlauf geleert. Wie kann ich helfen?');
    updateBadge(0);
  });

  document.querySelectorAll('.quick').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt || '';
      autoResize();
      input.focus();
    });
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  loadHistory();
  checkStatus();
  input.focus();
</script>
</body>
</html>
