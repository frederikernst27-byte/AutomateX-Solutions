<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClickBot Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    header span {
      font-size: 0.8rem;
      color: #6b7280;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    /* ── Stat Cards ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 20px;
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }

    .card-value.green { color: #34d399; }
    .card-value.red   { color: #f87171; }
    .card-value.blue  { color: #60a5fa; }

    /* ── Start Panel ── */
    .start-panel {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .start-panel h2 { font-size: 0.95rem; font-weight: 600; flex: 1; }

    select, button {
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 0.88rem;
      border: 1px solid #374151;
      background: #111827;
      color: #e2e8f0;
      cursor: pointer;
    }

    button.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
      font-weight: 600;
      transition: background 0.15s;
    }

    button.primary:hover { background: #4338ca; }
    button.primary:disabled { background: #374151; cursor: not-allowed; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* ── Runs Table ── */
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      text-align: left;
      padding: 10px 14px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #6b7280;
      border-bottom: 1px solid #2d3148;
    }

    tbody tr {
      border-bottom: 1px solid #1e2130;
      cursor: pointer;
      transition: background 0.1s;
    }

    tbody tr:hover { background: #1e2235; }

    tbody td {
      padding: 11px 14px;
      color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.success { background: #064e3b; color: #34d399; }
    .badge.error   { background: #450a0a; color: #f87171; }
    .badge.running { background: #1e3a5f; color: #60a5fa; }
    .badge.warning { background: #3b2300; color: #fbbf24; }

    /* ── Detail Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      width: 100%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #2d3148;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #1a1d27;
    }

    .modal-header h3 { font-size: 1rem; font-weight: 600; }

    .close-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .close-btn:hover { color: #e2e8f0; }

    .steps-list { padding: 16px 24px; }

    .step-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid #1e2130;
    }

    .step-row:last-child { border-bottom: none; }

    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .step-dot.ok      { background: #34d399; }
    .step-dot.error   { background: #f87171; }
    .step-dot.warning { background: #fbbf24; }
    .step-dot.running { background: #60a5fa; }

    .step-name { font-weight: 500; font-size: 0.875rem; }
    .step-time { font-size: 0.72rem; color: #6b7280; }
    .step-msg  { font-size: 0.78rem; color: #9ca3af; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #4f46e5;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.875rem;
      color: #e2e8f0;
      z-index: 200;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>⚡ ClickBot Dashboard</h1>
  <span id="last-update">–</span>
</header>

<div class="container">

  <!-- Stat Cards -->
  <div class="stats">
    <div class="card">
      <div class="card-label">Gesamt Runs</div>
      <div class="card-value blue" id="stat-total">–</div>
    </div>
    <div class="card">
      <div class="card-label">Erfolgreich</div>
      <div class="card-value green" id="stat-success">–</div>
    </div>
    <div class="card">
      <div class="card-label">Fehler</div>
      <div class="card-value red" id="stat-errors">–</div>
    </div>
    <div class="card">
      <div class="card-label">Erfolgsquote</div>
      <div class="card-value" id="stat-rate">–</div>
    </div>
    <div class="card">
      <div class="card-label">Letzter Run</div>
      <div style="font-size:0.85rem; color:#9ca3af; margin-top:6px;" id="stat-last">–</div>
    </div>
  </div>

  <!-- Start Panel -->
  <div class="start-panel">
    <h2>Neuen Run starten</h2>
    <select id="flow-select">
      <option value="amazon">Amazon Demo-Flow</option>
    </select>
    <label class="checkbox-row">
      <input type="checkbox" id="headless-check" />
      Headless (kein Browser-Fenster)
    </label>
    <button class="primary" id="start-btn" onclick="startRun()">▶ Starten</button>
  </div>

  <!-- Runs Table -->
  <div class="section-title">Letzte Runs</div>
  <div class="card" style="padding:0; overflow:hidden;">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Flow</th>
          <th>Status</th>
          <th>Gestartet</th>
          <th>Dauer</th>
        </tr>
      </thead>
      <tbody id="runs-tbody">
        <tr><td colspan="5" style="text-align:center;color:#6b7280;padding:24px;">Lade Daten…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Run Details</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="steps-list" id="modal-steps">
      <div style="color:#6b7280;text-align:center;padding:20px;">Lade…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = "";
  let refreshInterval = null;

  // ── Helpers ──────────────────────────────────────────────────────────────

  function fmt(iso) {
    if (!iso) return "–";
    return new Date(iso).toLocaleString("de-DE", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function duration(start, end) {
    if (!start) return "–";
    const s = new Date(start), e = end ? new Date(end) : new Date();
    const sec = Math.round((e - s) / 1000);
    if (sec < 60) return sec + "s";
    return Math.floor(sec / 60) + "m " + (sec % 60) + "s";
  }

  function badge(status) {
    const labels = { success: "Erfolgreich", error: "Fehler", running: "Läuft", warning: "Warnung" };
    const label = labels[status] || status;
    return `<span class="badge ${status}">${label}</span>`;
  }

  function showToast(msg, ms = 3000) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), ms);
  }

  // ── Stats ─────────────────────────────────────────────────────────────────

  async function loadStats() {
    try {
      const r = await fetch("/api/stats");
      const s = await r.json();
      document.getElementById("stat-total").textContent = s.total;
      document.getElementById("stat-success").textContent = s.success;
      document.getElementById("stat-errors").textContent = s.errors;
      const rate = document.getElementById("stat-rate");
      rate.textContent = s.success_rate + "%";
      rate.className = "card-value " + (s.success_rate >= 80 ? "green" : s.success_rate >= 50 ? "" : "red");
      const last = s.last_run;
      document.getElementById("stat-last").innerHTML = last
        ? `${badge(last.status)} &nbsp; ${fmt(last.started_at)}`
        : "–";
      document.getElementById("last-update").textContent = "Stand: " + new Date().toLocaleTimeString("de-DE");
    } catch (e) { /* ignore */ }
  }

  // ── Runs Table ────────────────────────────────────────────────────────────

  async function loadRuns() {
    try {
      const r = await fetch("/api/runs");
      const runs = await r.json();
      const tbody = document.getElementById("runs-tbody");

      if (!runs.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7280;padding:24px;">Noch keine Runs vorhanden</td></tr>';
        return;
      }

      tbody.innerHTML = runs.map(run => `
        <tr onclick="openRun(${run.id})">
          <td>#${run.id}</td>
          <td>${run.flow_name}</td>
          <td>${badge(run.status)}${run.status === "running" ? ' <span class="spinner"></span>' : ""}</td>
          <td>${fmt(run.started_at)}</td>
          <td>${duration(run.started_at, run.finished_at)}</td>
        </tr>
      `).join("");
    } catch(e) { /* ignore */ }
  }

  function refresh() {
    loadStats();
    loadRuns();
  }

  // ── Start Run ─────────────────────────────────────────────────────────────

  async function startRun() {
    const btn = document.getElementById("start-btn");
    const flow = document.getElementById("flow-select").value;
    const headless = document.getElementById("headless-check").checked;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Starte…';

    try {
      const r = await fetch("/api/runs/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ flow, headless })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Fehler");
      showToast(`Run #${data.run_id} gestartet ✓`);
      refresh();
    } catch (e) {
      showToast("Fehler: " + e.message, 5000);
    } finally {
      btn.disabled = false;
      btn.innerHTML = "▶ Starten";
    }
  }

  // ── Detail Modal ──────────────────────────────────────────────────────────

  async function openRun(id) {
    document.getElementById("modal-title").textContent = `Run #${id} – Details`;
    document.getElementById("modal-steps").innerHTML =
      '<div style="color:#6b7280;text-align:center;padding:20px;">Lade…</div>';
    document.getElementById("modal").classList.add("open");

    try {
      const r = await fetch(`/api/runs/${id}`);
      const data = await r.json();
      const { run, steps } = data;

      const stepRows = steps.length ? steps.map(s => `
        <div class="step-row">
          <div class="step-dot ${s.status}"></div>
          <div>
            <div class="step-name">${s.step_name}</div>
            <div class="step-time">${fmt(s.timestamp)}</div>
            ${s.message ? `<div class="step-msg">${escHtml(s.message)}</div>` : ""}
          </div>
        </div>
      `).join("") : '<div style="color:#6b7280;padding:12px;">Keine Steps vorhanden.</div>';

      document.getElementById("modal-steps").innerHTML = `
        <div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2d3148;font-size:0.82rem;color:#9ca3af;">
          ${badge(run.status)} &nbsp;
          Flow: <strong>${run.flow_name}</strong> &nbsp;·&nbsp;
          Dauer: <strong>${duration(run.started_at, run.finished_at)}</strong>
          ${run.error_message ? `<div style="color:#f87171;margin-top:8px;font-size:0.78rem;">${escHtml(run.error_message)}</div>` : ""}
        </div>
        ${stepRows}
      `;
    } catch (e) {
      document.getElementById("modal-steps").innerHTML =
        `<div style="color:#f87171;padding:12px;">Fehler: ${e.message}</div>`;
    }
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById("modal")) {
      document.getElementById("modal").classList.remove("open");
    }
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  async function loadFlows() {
    try {
      const r = await fetch("/api/flows");
      const { flows } = await r.json();
      const sel = document.getElementById("flow-select");
      sel.innerHTML = flows.map(f =>
        `<option value="${f}">${f.charAt(0).toUpperCase() + f.slice(1)} Flow</option>`
      ).join("");
    } catch(e) { /* fallback bleibt */ }
  }

  refresh();
  loadFlows();
  // Auto-Refresh alle 5 Sekunden
  refreshInterval = setInterval(refresh, 5000);
</script>
</body>
</html>
